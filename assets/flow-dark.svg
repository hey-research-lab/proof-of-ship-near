<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="How a bounty pays: a funder opens and funds a USDC bounty; HEY counts ships with sources and signs EIP-712; the contract verifies with env::ecrecover on NEAR; the builder is paid at its eth-implicit account or via NEAR Intents. A claim is accepted until the deadline plus 3 days; after that each funder refunds exactly what it put in.">
<style>.w{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.dot{animation:travel 9s ease-in-out infinite}@keyframes travel{0%,8%{transform:translateX(0)}85%,100%{transform:translateX(904px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="480" rx="14" fill="#0B0E11"/>
<text x="40" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#C2FB03">HOW A BOUNTY PAYS</text>
<text x="40" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94A0AD">Four steps on NEAR. Nobody has to trust the funder to press pay, and the submitter cannot redirect anything.</text>
<g><rect x="40" y="100" width="250" height="200" rx="12" fill="#14181D" stroke="#272D35"/>
<text x="60" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#C2FB03">01</text>
<text x="60" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECF0">Fund</text>
<text x="60" y="194" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">A funder opens a USDC bounty</text><text x="60" y="214" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">behind a project with a target,</text><text x="60" y="234" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">say 3 ships in 14 days, and</text><text x="60" y="254" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">funds it.</text>
<line x1="60" x2="270" y1="262" y2="262" stroke="#272D35"/>
<text x="60" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E9ECF0">create · ft_transfer_call</text></g>
<g><rect x="330" y="100" width="250" height="200" rx="12" fill="#14181D" stroke="#272D35"/>
<text x="350" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#C2FB03">02</text>
<text x="350" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECF0">Count</text>
<text x="350" y="194" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">HEY counts the project’s ships,</text><text x="350" y="214" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">each with its public source,</text><text x="350" y="234" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">and signs the count as EIP-712.</text>
<line x1="350" x2="560" y1="262" y2="262" stroke="#272D35"/>
<text x="350" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E9ECF0">GET …/proof-of-ship/attestation</text></g>
<g><rect x="620" y="100" width="250" height="200" rx="12" fill="#14181D" stroke="#272D35"/>
<text x="640" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#C2FB03">03</text>
<text x="640" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECF0">Verify</text>
<text x="640" y="194" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">Anyone submits the claim. The</text><text x="640" y="214" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">escrow rebuilds the digest and</text><text x="640" y="234" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">recovers the signer on NEAR.</text>
<line x1="640" x2="850" y1="262" y2="262" stroke="#272D35"/>
<text x="640" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E9ECF0">env::keccak256 · env::ecrecover</text></g>
<g><rect x="910" y="100" width="250" height="200" rx="12" fill="#14181D" stroke="#272D35"/>
<text x="930" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#C2FB03">04</text>
<text x="930" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECF0">Pay</text>
<text x="930" y="194" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">The builder is paid at its</text><text x="930" y="214" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">eth-implicit account, the</text><text x="930" y="234" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">address HEY signed, or into</text><text x="930" y="254" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A0AD">NEAR Intents.</text>
<line x1="930" x2="1140" y1="262" y2="262" stroke="#272D35"/>
<text x="930" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E9ECF0">ft_transfer → 0x… | intents.near</text></g>
<path class="w" style="animation-delay:0.0s" d="M294 200H320" stroke="#C2FB03" stroke-width="2"/><path d="M318 195L326 200L318 205" fill="none" stroke="#C2FB03" stroke-width="2" stroke-linejoin="round"/><path class="w" style="animation-delay:0.4s" d="M584 200H610" stroke="#C2FB03" stroke-width="2"/><path d="M608 195L616 200L608 205" fill="none" stroke="#C2FB03" stroke-width="2" stroke-linejoin="round"/><path class="w" style="animation-delay:0.8s" d="M874 200H900" stroke="#C2FB03" stroke-width="2"/><path d="M898 195L906 200L898 205" fill="none" stroke="#C2FB03" stroke-width="2" stroke-linejoin="round"/>
<line x1="56" x2="760" y1="380" y2="380" stroke="#C2FB03" stroke-width="3"/>
<line x1="760" x2="960" y1="380" y2="380" stroke="#C2FB03" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="960" x2="1144" y1="380" y2="380" stroke="#3A424D" stroke-width="3"/>
<line x1="56" x2="56" y1="372" y2="388" stroke="#E9ECF0" stroke-width="2"/><text x="56" y="410" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9ECF0">Opened</text><text x="56" y="430" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94A0AD">the window starts</text>
<line x1="760" x2="760" y1="372" y2="388" stroke="#E9ECF0" stroke-width="2"/><text x="760" y="410" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9ECF0">Deadline</text><text x="760" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94A0AD">last moment a counted window may end</text>
<line x1="960" x2="960" y1="372" y2="388" stroke="#E9ECF0" stroke-width="2"/><text x="960" y="410" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9ECF0">+ 3 days</text><text x="960" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94A0AD">last claim</text>
<text x="1144" y="410" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9ECF0">Refunds</text>
<text x="1144" y="430" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94A0AD">each funder, exactly</text>
<circle class="dot" cx="56" cy="380" r="6" fill="#C2FB03"/>
<text x="40" y="466" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#94A0AD">Not to scale: a bounty runs 1 to 365 days. A verified bounty is owed to its builder and is never refunded.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="What a claim cannot do. Refused, each by a unit test: replay, a high-s twin signature, a Robinhood Chain signature, a testnet signature on mainnet, another escrow's signature, a wrong attester, a tampered count, below target, a stale or future attestation, a wrong window, a wrong builder or project, and a claim after the deadline plus 3 days. Not claimed in time, each funder refunds exactly what it put in.">
<style>.p{animation:pulse 3.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="720" rx="14" fill="#F5F6F8"/>
<text x="40" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">WHAT A CLAIM CANNOT DO</text>
<text x="40" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#535B66">The escrow trusts one EVM key, fixed at init. Every refusal below is a unit test, and none of it has an admin override.</text>
<rect x="24" y="96" width="1152" height="56" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="42" y="120" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#535B66">SIGNING DOMAIN</text>
<text x="42" y="140" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#0B0E11">name "HEY Proof of Ship" · version "1" · chainId <tspan fill="#4F7A00">397</tspan> (testnet 398) · salt <tspan fill="#4F7A00">keccak256(escrow account id)</tspan></text>
<g><rect x="24.0" y="168" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="42.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Replay</text>
<text x="42.0" y="224" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">The same claim again, before or</text><text x="42.0" y="242" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">after the payout.</text>
<rect class="p" style="animation-delay:-0.00s" x="42.0" y="278" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="54.0" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_ALREADY_CLAIMED</text></g>
<g><rect x="315.5" y="168" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="333.5" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">High-s twin</text>
<text x="333.5" y="224" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">The other valid signature of the</text><text x="333.5" y="242" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">same key (EIP-2), refused before</text><text x="333.5" y="260" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">ecrecover.</text>
<rect class="p" style="animation-delay:-0.45s" x="333.5" y="278" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="345.5" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_HIGH_S</text></g>
<g><rect x="607.0" y="168" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="625.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Robinhood Chain signature</text>
<text x="625.0" y="224" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">A count signed for chain 4663 with</text><text x="625.0" y="242" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">a verifyingContract.</text>
<rect class="p" style="animation-delay:-0.90s" x="625.0" y="278" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="637.0" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_SIGNER</text></g>
<g><rect x="898.5" y="168" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="916.5" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Testnet on mainnet</text>
<text x="916.5" y="224" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">A chain 398 signature sent to a</text><text x="916.5" y="242" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">chain 397 escrow.</text>
<rect class="p" style="animation-delay:-1.35s" x="916.5" y="278" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="928.5" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_SIGNER</text></g>
<g><rect x="24.0" y="310" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="42.0" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Another escrow</text>
<text x="42.0" y="366" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">A signature salted with another</text><text x="42.0" y="384" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">escrow’s account id.</text>
<rect class="p" style="animation-delay:-1.80s" x="42.0" y="420" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="54.0" y="426" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_SIGNER</text></g>
<g><rect x="315.5" y="310" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="333.5" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Wrong attester</text>
<text x="333.5" y="366" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Any key but the one address fixed</text><text x="333.5" y="384" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">at init.</text>
<rect class="p" style="animation-delay:-2.25s" x="333.5" y="420" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="345.5" y="426" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_SIGNER</text></g>
<g><rect x="607.0" y="310" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="625.0" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Tampered count</text>
<text x="625.0" y="366" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Ships raised after HEY signed.</text>
<rect class="p" style="animation-delay:-2.70s" x="625.0" y="420" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="637.0" y="426" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_SIGNER</text></g>
<g><rect x="898.5" y="310" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="916.5" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Below target</text>
<text x="916.5" y="366" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Fewer ships than the bounty’s</text><text x="916.5" y="384" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">min_ships.</text>
<rect class="p" style="animation-delay:-3.15s" x="916.5" y="420" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="928.5" y="426" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_NOT_ENOUGH_SHIPS</text></g>
<g><rect x="24.0" y="452" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="42.0" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Stale or future</text>
<text x="42.0" y="508" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Signed more than a day ago, or</text><text x="42.0" y="526" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">dated ahead of the block.</text>
<rect class="p" style="animation-delay:-3.60s" x="42.0" y="562" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="54.0" y="568" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_STALE_ATTESTATION</text></g>
<g><rect x="315.5" y="452" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="333.5" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Wrong window</text>
<text x="333.5" y="508" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Not from the bounty’s start, or</text><text x="333.5" y="526" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">ending after the deadline or</text><text x="333.5" y="544" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">issuedAt.</text>
<rect class="p" style="animation-delay:-4.05s" x="333.5" y="562" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="345.5" y="568" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_WINDOW</text></g>
<g><rect x="607.0" y="452" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="625.0" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Wrong builder or project</text>
<text x="625.0" y="508" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">Another payout address, or another</text><text x="625.0" y="526" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">HEY slug.</text>
<rect class="p" style="animation-delay:-4.50s" x="625.0" y="562" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="637.0" y="568" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_WRONG_BUILDER · _PROJECT</text></g>
<g><rect x="898.5" y="452" width="277.5" height="128" rx="10" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="916.5" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Too late</text>
<text x="916.5" y="508" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">After the deadline plus the 3-day</text><text x="916.5" y="526" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#535B66">claim grace.</text>
<rect class="p" style="animation-delay:-4.95s" x="916.5" y="562" width="5" height="5" rx="2.5" fill="#4F7A00"/>
<text x="928.5" y="568" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4F7A00">ERR_CLAIM_CLOSED</text></g>
<rect x="24" y="600" width="1152" height="76" rx="10" fill="rgba(79,122,0,0.14)" stroke="#4F7A00"/>
<text x="42" y="632" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0B0E11">Nothing shipped in time? Every funder takes back exactly what it put in.</text>
<text x="42" y="656" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#535B66">refund(id) opens after the deadline plus 3 days. Refunding twice, refunding early or refunding a verified bounty is refused; so is funding with another token or after the deadline.</text>
<text x="40" y="704" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">50 unit tests (19 named "refused") and 3 sandbox tests on a local NEAR node, run by CI on every push.</text>
</svg>

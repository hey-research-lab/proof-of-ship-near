[package]
name = "integration-tests"
description = "Sandbox tests: the escrow, a NEP-141 token and an Intents stand-in on a local NEAR node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
near-workspaces = { version = "=0.23.0", default-features = false, features = ["install"] }
# The same node near-workspaces runs, started here so its fast-forward can move the clock by days (see setup()).
near-sandbox = "=0.3.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
